name: Injection Lab

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título para testar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Direct shell injection test
        run: |
          echo "===== BEFORE ====="
          echo 'TITLE: ${{ inputs.title }}'
          echo "===== AFTER ====="
