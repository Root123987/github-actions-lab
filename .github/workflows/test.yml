name: Injection Lab

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título para testar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test title
        env:
          TITLE: ${{ inputs.title }}

        run: |
          echo "===== INICIO ====="
          echo "Título recebido: ${{ toJson(env.TITLE) }}"
          echo "===== FIM ====="

      - name: Safe shell test
        env:
          TITLE: ${{ inputs.title }}

        run: |
          echo "===== SAFE TEST ====="
          printf '%s\n' "$TITLE"
          echo "===== SAFE END ====="
