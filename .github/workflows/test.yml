name: Injection Lab

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título para testar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Reproduce original command
        env:
          TITLE: ${{ inputs.title }}

        run: |
          echo "===== BEFORE ====="

          curl --version

          curl \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"title": ${{ toJson(env.TITLE) }}}' \
            http://127.0.0.1:9

          echo "===== AFTER ====="
