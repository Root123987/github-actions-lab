name: Injection Lab

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título para testar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Reproduce original sink
        env:
          TITLE: ${{ inputs.title }}

        run: |
          echo "===== BEFORE ====="

          echo 'Payload: {"title": ${{ toJson(env.TITLE) }}}'

          echo "===== AFTER ====="
